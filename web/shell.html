<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b543e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Sawayama Solitaire</title>
  <style>
    /* Expose iOS safe-area insets as CSS variables. SDL3's web backend doesn't
       surface env(safe-area-inset-*) through SDL_GetWindowSafeArea, so the C++
       layout reads these (see computeLayout in render.cpp) to inset the content
       when launched standalone from the home screen (under the status bar /
       home indicator). Needs viewport-fit=cover (above) to be non-zero. */
    :root {
      --sai-top:    env(safe-area-inset-top);
      --sai-bottom: env(safe-area-inset-bottom);
      --sai-left:   env(safe-area-inset-left);
      --sai-right:  env(safe-area-inset-right);
    }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background: #0b543e;
      overscroll-behavior: none;
      /* Pinch yes, pan and double-tap-zoom no. Combined with the preventDefault
         override below, this lets the browser engage compositor pinch (e.g. iOS
         Safari's pinch-to-show-tabs / overview) while in-page zoom stays
         disabled (maximum-scale=1, user-scalable=no). */
      touch-action: pinch-zoom;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
    }
    body { position: fixed; inset: 0; }
    /* SDL sets touch-action:none inline on the canvas; !important overrides it
       so the browser keeps pinch gesture recognition. */
    canvas#canvas { display: block; width: 100%; height: 100%; outline: none;
                    touch-action: pinch-zoom !important; }
    #loading { position: absolute; inset: 0; display: flex; align-items: center;
               justify-content: center; color: #cfe9df; font: 16px system-ui, sans-serif; }
  </style>
</head>
<body>
  <div id="loading">Loading…</div>
  <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
  <script>
    (function () {
      // Neutralize preventDefault() for touch events so the browser can engage
      // compositor-level pinch recognition. SDL3's Emscripten wrapper calls
      // e.preventDefault() on touch pointer events, which would otherwise block
      // it. Patching Event.prototype catches every call site; must run before
      // the Emscripten loader is evaluated.
      var origPreventDefault = Event.prototype.preventDefault;
      Event.prototype.preventDefault = function () {
        if (this.pointerType === 'touch') return;   // PointerEvent (touch)
        if (this.touches !== undefined) return;      // TouchEvent
        return origPreventDefault.call(this);
      };

      var canvas = document.getElementById('canvas');

      // When a second finger lands, cancel any in-flight drag and hide the rest
      // of this gesture from SDL3, so a pinch isn't interpreted as drags/taps
      // and the browser takes over the gesture.
      var activeTouchPointers = new Set();
      var multiTouchActive = false;
      function multiTouchFilter(e) {
        if (e.pointerType !== 'touch') return;
        if (e.type === 'pointerdown') {
          activeTouchPointers.add(e.pointerId);
          if (activeTouchPointers.size >= 2 && !multiTouchActive) {
            activeTouchPointers.forEach(function (id) {
              if (id !== e.pointerId) {
                canvas.dispatchEvent(new PointerEvent('pointercancel', {
                  pointerId: id, pointerType: 'touch', bubbles: true, cancelable: true,
                }));
              }
            });
            multiTouchActive = true;
          }
          if (multiTouchActive) e.stopImmediatePropagation();
          return;
        }
        if (e.type === 'pointermove') {
          if (multiTouchActive) e.stopImmediatePropagation();
          return;
        }
        if (e.type === 'pointerup' || e.type === 'pointercancel') {
          activeTouchPointers.delete(e.pointerId);
          if (multiTouchActive) {
            e.stopImmediatePropagation();
            if (activeTouchPointers.size === 0) multiTouchActive = false;
          }
          return;
        }
      }
      ['pointerdown', 'pointermove', 'pointerup', 'pointercancel'].forEach(function (t) {
        window.addEventListener(t, multiTouchFilter, {capture: true});
      });

      window.Module = {
        canvas: canvas,
        onRuntimeInitialized: function () {
          var l = document.getElementById('loading');
          if (l) l.remove();
        }
      };

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('sw.js').catch(function () {});
        });
      }
    })();
  </script>
  {{{ SCRIPT }}}
</body>
</html>
